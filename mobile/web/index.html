<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Веб-сборка ГАРБЫ: в браузере и как Mini App в Telegram (07.10.2026).
       Собирается: flutter build web --release --base-href /play/ -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ГАРБА — казахская карточная игра на 4–7 игроков.">
  <meta name="theme-color" content="#07131B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ГАРБА">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ГАРБА</title>
  <link rel="manifest" href="manifest.json">
  <!-- Связь с Telegram: данные игрока и кнопки Telegram. Вне Telegram ничего не делает. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #07131B; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #D4A94F; font: 700 22px/1 -apple-system, system-ui, sans-serif; letter-spacing: 4px; }
  </style>
</head>
<body>
  <div id="loading">ГАРБА</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
