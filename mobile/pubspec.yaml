name: garba_mobile
description: GARBA mobile MVP
publish_to: "none"
version: 1.0.0+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  http: ^1.2.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  socket_io_client: ^3.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/card_back.png
    - assets/branding/court_cards.png
    - assets/shop/
    - assets/sounds/ready.wav
    - assets/sounds/card.mp3
    - assets/sounds/garba.wav
    - assets/sounds/move.wav
    - assets/sounds/raz.wav
    - assets/sounds/dva.wav
    - assets/sounds/kon.wav
    - assets/sounds/risk1.wav
    - assets/sounds/risk2.wav
    - assets/sounds/risk3.wav
    - assets/sounds/risk4.wav
    - assets/sounds/risk5.wav
    - assets/sounds/win.wav
    - assets/sounds/lose.wav
